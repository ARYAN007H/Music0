[package]
name = "musico-online"
version = "0.9.5"
edition = "2021"
rust-version = "1.78"
description = "Musico Online — clean-room Apple Music-class player on free sources"

[lib]
name = "musico_online_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "musico-online"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
musico_playback = { path = "../musico_playback" }
musico_recommender = { path = "../musico_recommender" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
walkdir = "2"
base64 = "0.22"
# JioSaavn media URLs are "encrypted" with DES-ECB under a fixed public key
# (shipped in every community client) — decoding metadata, not DRM circumvention.
des = "0.8"
ecb = { version = "0.1", features = ["alloc"] }
image = "0.25"
dirs = "5"
symphonia = { version = "0.5", features = ["all"] }
rand = "0.8"
tokio = { version = "1", features = ["sync", "time", "rt"] }
# Online music: InnerTube (YT Music) search + thumbnail fetch.
# http2: connection reuse + header compression on the catalog endpoints.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "http2"] }

# Desktop-only native folder dialog and single-instance lock (not supported on Android).
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.14"
tauri-plugin-single-instance = "2"

# System media controls: SMTC (Windows) / MPNowPlayingInfoCenter (macOS).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
souvlaki = { version = "0.8", default-features = false }

# MPRIS is a D-Bus (freedesktop.org) interface — Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "4", default-features = false, features = ["tokio"] }

# Android storage bootstrap (#108): app processes have no $HOME and dirs-sys'
# android fallback returns None, so the JNI lib reads the app-private
# files/cache dirs via ndk-context + jni and exports the XDG vars that the
# unix `dirs` code path (compiled on android) resolves against.
# android_logger mirrors the log crate straight to logcat — the only
# always-available debugging surface on a device (stderr/file are not
# readable there without root). Chosen over tauri-plugin-log: its LogDir
# target resolves a Tauri path during plugin init and that can silently
# fail on Android, leaving NO logger installed (observed on device).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
android_logger = "0.15"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

