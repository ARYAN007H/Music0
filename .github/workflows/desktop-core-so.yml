name: Desktop CMP bundle (PR preview)

# Builds a ready-to-run x86_64 Linux Compose Multiplatform desktop test bundle
# with the Rust JNI core (libmusico_online_lib.so) bundled inside app resources
# so it runs out of the box without any local compilation or env vars.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'gemini/') || startsWith(github.head_ref, 'fix/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install audio system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Build Rust JNI core (libmusico_online_lib.so)
        run: cargo build --release -p musico_core --lib

      - name: Stage native core into Compose Desktop resources
        run: |
          mkdir -p android/desktopApp/resources/linux
          cp target/release/libmusico_online_lib.so android/desktopApp/resources/linux/

      - name: Set up Java 17 (Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle (pinned to match release.yml)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Android SDK environment
        run: echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Package prebuilt desktop bundle
        run: |
          gradle -p android :desktopApp:createDistributable --console=plain
          mkdir -p dist-desktop
          cp target/release/libmusico_online_lib.so dist-desktop/
          APPDIR=$(find android/desktopApp/build/compose/binaries -type d -name app | head -1)
          [ -n "$APPDIR" ] || { echo "Compose app bundle not found" >&2; exit 1; }
          cp -r "$APPDIR" dist-desktop/app
          cd dist-desktop
          zip -qr ../musico-desktop-test.zip .

      - name: Upload prebuilt desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: desktop-app-test
          path: musico-desktop-test.zip
          if-no-files-found: error
