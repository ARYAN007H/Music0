name: Desktop core .so

# Builds the x86_64-linux cdylib (libmusico_online_lib.so) that the Compose
# Multiplatform desktop app loads over JNI (MusicoCore.desktop.kt). The Tauri
# bundles link the core statically, so this artifact is the only desktop-JVM
# dev path that doesn't require a local cargo build.
on:
  workflow_dispatch:
  # Runs as a PR check for the gemini/* branches so the desktop cdylib
  # artifact is available while testing a round (workflow_dispatch alone
  # can't fire for a file that isn't on the default branch yet).
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    # gemini/* heads only — keeps ordinary PRs from paying for this build.
    if: startsWith(github.head_ref, 'gemini/')
    runs-on: ubuntu-latest

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libfontconfig1-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build cdylib
        run: cargo build --release --lib
        working-directory: src-tauri

      - name: Upload core library
        uses: actions/upload-artifact@v4
        with:
          name: desktop-core-so
          path: src-tauri/target/release/libmusico_online_lib.so
          if-no-files-found: error
