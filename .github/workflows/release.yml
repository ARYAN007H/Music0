name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs verify platform jobs on a branch (publish skips itself
  # below) — e.g. before merging cross-platform changes. The version
  # inputs are the updater test rig: pose as an old version and watch
  # the real update flow run against the latest published release.
  workflow_dispatch:
    inputs:
      version_code:
        description: "Override Android versionCode (e.g. 90100 to pose as 0.9.1)"
        required: false
        type: string
      version_name:
        description: "Override Android versionName (e.g. 0.9.1-native)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64 (deb / rpm / AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libfontconfig1-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libwayland-dev libxkbcommon-dev

      - name: Tests
        run: cargo test --workspace --exclude musico_playback
        # Engine e2e tests need a real audio device — CI runners have none.
        # The InnerTube live test is #[ignore]-gated and stays skipped here.

      - name: Install Tauri CLI
        run: npm install --global "@tauri-apps/cli@^2"

      - name: Build bundles
        run: tauri build --bundles deb,rpm,appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        # linuxdeploy runs via extract-and-run — CI runners have no FUSE.

      - name: Package raw binary
        run: |
          mkdir -p dist
          cp target/release/musico-online dist/musico-online-linux-x86_64
          chmod +x dist/musico-online-linux-x86_64
          tar czf dist/musico-online-linux-x86_64.tar.gz -C dist musico-online-linux-x86_64

      - name: Collect packages
        run: |
          cp target/release/bundle/deb/*.deb dist/
          cp target/release/bundle/rpm/*.rpm dist/
          cp target/release/bundle/appimage/*.AppImage dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS universal (dmg / app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (both darwin targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace --exclude musico_playback
        # Native arm64 run — also type-checks the cfg(target_os = "macos")
        # blocks (menu, media controls) that the Linux job compiles out.
        # Engine e2e excluded as on Linux: no audio device on CI runners.

      - name: Install Tauri CLI
        run: npm install --global "@tauri-apps/cli@^2"

      - name: Build universal bundles
        run: tauri build --target universal-apple-darwin --bundles dmg,app
        # Unsigned: no Apple Developer identity in CI. macOS Gatekeeper
        # blocks unsigned apps on first open — documented in the release
        # body and README (right-click → Open, or `xattr -cr`).

      - name: Collect packages
        run: |
          mkdir -p dist
          B=target/universal-apple-darwin/release/bundle
          cp "$B"/dmg/*.dmg dist/
          tar czf dist/musico-online-macos-universal.app.tar.gz \
            -C "$B/macos" "Musico Online.app"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows x86_64 (msi / nsis exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace --exclude musico_playback

      - name: Install Tauri CLI
        run: npm install --global "@tauri-apps/cli@^2"

      - name: Build Windows bundles
        # bash, not the Windows-default PowerShell: PS eats the comma in
        # `msi,nsis` and passes `msi nsis`, which the CLI rejects.
        run: tauri build --bundles msi,nsis
        shell: bash

      - name: Collect packages
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/bundle/msi/*.msi dist/ || true
          cp target/release/bundle/nsis/*.exe dist/ || true
          cp target/release/musico-online.exe dist/musico-online-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  android:
    name: Android aarch64 (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Java 17 (Gradle + apksigner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install project dependencies (CLI as devDependency)
        # Everything Tauri-CLI on this job goes through `npm run tauri`:
        # the Gradle→Rust bridge that `tauri android init` generates is
        # templated from the invoking process — a bare `tauri` in a shell
        # step renders `node tauri …` (→ "Cannot find module …/src-tauri/
        # tauri"), while an npm-script invocation (npm_execpath set) renders
        # `npm run -- tauri …`, which resolves the local CLI in node_modules.
        run: npm install

      - name: Android SDK environment
        run: |
          # SDK + NDK ship preinstalled on ubuntu-latest runners.
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -1)
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Build APK (aarch64)
        # tauri.android.conf.json lowers the app id for the Android package
        # (Java namespaces are lowercase; the desktop identifier keeps its
        # case for Flatpak).  Pure-Rust resolvers stream on-device — no
        # yt-dlp on Android.
        run: |
          npm run tauri -- android init
          # The Rust lib links libc++_shared (cpal → oboe is C++; build.rs
          # adds the DT_NEEDED) — AGP only packs it when it sits in jniLibs.
          # NDK r30 dropped the sources/cxx-stl prebuilts AND the sysroot
          # copies probed earlier, so hunt for a REAL (non-stub, >100k)
          # arm64 runtime across every installed NDK, newest first.
          LIBCXX=""
          for NDK_DIR in $(ls -d "$ANDROID_HOME"/ndk/* | sort -Vr); do
            LIBCXX=$(find "$NDK_DIR" \( -path '*arm64-v8a*' -o -path '*aarch64*' \) \
              -name 'libc++_shared.so' -size +100k 2>/dev/null | sort | head -1)
            [ -n "$LIBCXX" ] && break
          done
          if [ -z "$LIBCXX" ]; then
            echo "No real arm64 libc++_shared.so in any installed NDK:" >&2
            ls "$ANDROID_HOME"/ndk/ >&2
            find "$ANDROID_HOME"/ndk -name 'libc++_shared.so' 2>/dev/null | head -20 >&2
            exit 1
          fi
          echo "Packing $LIBCXX"
          mkdir -p src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
          cp "$LIBCXX" src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/
          npm run tauri -- android build --apk --target aarch64

      - name: Collect and sign APK
        run: |
          mkdir -p dist
          # `tauri android build --apk --target aarch64` writes one APK under
          # apk/universal/ (the folder is named by the Gradle flavor, not the
          # target), so locate it instead of hard-coding the ABI directory.
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk \
            -type f -name '*-release-unsigned.apk' | head -1)
          if [ -z "$UNSIGNED" ]; then
            echo "No unsigned APK produced; build output was:" >&2
            find src-tauri/gen/android/app/build/outputs -type f -name '*.apk' >&2 || true
            exit 1
          fi
          echo "Signing $UNSIGNED"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/musico.keystore
          "$BT/zipalign" -f 4 "$UNSIGNED" /tmp/musico-aligned.apk
          "$BT/apksigner" sign \
            --ks /tmp/musico.keystore \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass pass:"$ANDROID_KEY_PASSWORD" \
            --out dist/musico-online-android-aarch64.apk /tmp/musico-aligned.apk
          "$BT/apksigner" verify dist/musico-online-android-aarch64.apk
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

  android-native:
    name: Android native aarch64 (Compose APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Java 17 (Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK environment
        run: |
          # SDK + NDK ship preinstalled on ubuntu-latest runners.
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -1)
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build Rust core (libmusico_online_lib.so)
        # Same cdylib the Tauri shell loads — the native app reaches it via
        # the mobile JNI bridge (#111). --lib: the desktop bin is not part
        # of the phone artifact. MUSICO_VERSION_OVERRIDE is the updater test
        # rig: a dispatch posing as an older version compiles that string
        # into app.update.check (never set for real releases).
        run: cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release --lib
        working-directory: src-tauri
        env:
          MUSICO_VERSION_OVERRIDE: ${{ inputs.version_name || '' }}

      - name: Ensure libc++_shared.so is packed
        # Same hunt as the Tauri android job: NDK r30 dropped the well-known
        # copies, so find a REAL (non-stub, >100k) arm64 runtime, newest NDK
        # first. cargo-ndk usually packs it; this is the belt to its braces.
        run: |
          if [ -f android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so ] && \
             [ "$(stat -c%s android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so)" -gt 100000 ]; then
            echo "cargo-ndk already packed a real libc++_shared.so"
            exit 0
          fi
          LIBCXX=""
          for NDK_DIR in $(ls -d "$ANDROID_HOME"/ndk/* | sort -Vr); do
            LIBCXX=$(find "$NDK_DIR" \( -path '*arm64-v8a*' -o -path '*aarch64*' \) \
              -name 'libc++_shared.so' -size +100k 2>/dev/null | sort | head -1)
            [ -n "$LIBCXX" ] && break
          done
          if [ -z "$LIBCXX" ]; then
            echo "No real arm64 libc++_shared.so in any installed NDK" >&2
            exit 1
          fi
          echo "Packing $LIBCXX"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp "$LIBCXX" android/app/src/main/jniLibs/arm64-v8a/

      - name: Build native APK (gradle)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Decode keystore
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/musico.keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: Derive Android version from the release tag
        run: |
          # Explicit dispatch inputs win — that's the updater test rig.
          if [ -n "${{ inputs.version_code }}" ]; then
            echo "MUSICO_VERSION_NAME=${{ inputs.version_name }}" >> "$GITHUB_ENV"
            echo "MUSICO_VERSION_CODE=${{ inputs.version_code }}" >> "$GITHUB_ENV"
            exit 0
          fi
          VER="${GITHUB_REF_NAME#v}"
          VER="${VER%%-*}"
          if [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            MINOR=$(cut -d. -f2 <<< "$VER")
            PATCH=$(cut -d. -f3 <<< "$VER")
            echo "MUSICO_VERSION_NAME=${VER}-native" >> "$GITHUB_ENV"
            echo "MUSICO_VERSION_CODE=$((MINOR * 10000 + PATCH * 100))" >> "$GITHUB_ENV"
          else
            # workflow_dispatch / branch runs keep the gradle defaults
            echo "MUSICO_VERSION_NAME=${MUSICO_VERSION_NAME:-0.9.5-native}" >> "$GITHUB_ENV"
            echo "MUSICO_VERSION_CODE=${MUSICO_VERSION_CODE:-90500}" >> "$GITHUB_ENV"
          fi

      - name: Assemble release APK
        run: gradle :app:assembleRelease "-PmusicoVersionCode=${MUSICO_VERSION_CODE:-90500}" "-PmusicoVersionName=${MUSICO_VERSION_NAME:-0.9.5-native}"
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: /tmp/musico.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Collect and verify APK
        run: |
          mkdir -p dist
          UNSIGNED=$(find android/app/build/outputs/apk -type f -name '*-release*.apk' | head -1)
          [ -n "$UNSIGNED" ] || { echo "no APK produced" >&2; exit 1; }
          cp "$UNSIGNED" dist/musico-online-native-aarch64.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify dist/musico-online-native-aarch64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android-native
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [linux, macos, windows, android]
    # Dispatch runs exist to VERIFY the platform jobs; only tags release
    # (a dispatch ref has no tag — action-gh-release errors harmlessly,
    # but skipping keeps the verification run green).
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Musico Online ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            **Musico Online** — Cross-platform player (Linux, macOS, Windows, Android APK, and iOS/Mobile PWA) with free online music:
            InnerTube (YT Music) + JioSaavn + Piped/Invidious + Pure-Rust direct streaming, Browse home screen, synced lyrics, and Sonic Lab DSP.

            **Linux** — `.deb` / `.rpm` / `.AppImage`, or the bare binary in the `.tar.gz`.
            **macOS** — universal `.dmg` (Apple Silicon + Intel). Unsigned: on first open, right-click the app → **Open** (or `xattr -cr /Applications/Musico\ Online.app`).
            **Windows** — `.msi` / `.exe` installer (or standalone `musico-online-windows-x86_64.exe`).
            **Android** — signed `musico-online-android-aarch64.apk` (64-bit ARM; every modern phone). Streaming runs on the pure-Rust InnerTube/Piped/Saavn resolvers + AAudio — no yt-dlp on device.
            **iOS & Mobile Web** — open in Safari/Chrome and tap **Install App** / **Add to Home Screen** for full standalone PWA + Lock-Screen MediaSession controls.

