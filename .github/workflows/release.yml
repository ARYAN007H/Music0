name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs verify all platform jobs on a branch (publish skips itself
  # below). The optional version inputs also serve as the updater test rig.
  workflow_dispatch:
    inputs:
      version_code:
        description: "Override Android versionCode (e.g. 90500 to pose as 0.9.5)"
        required: false
        type: string
      version_name:
        description: "Override app versionName (e.g. 0.9.5-cmp)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  linux-desktop:
    name: Linux x86_64 (Compose Multiplatform deb / rpm / AppImage / Flatpak / tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install build & packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config rpm fakeroot binutils flatpak flatpak-builder desktop-file-utils appstream

      - name: Rust core tests
        run: cargo test --workspace --exclude musico_playback

      - name: Build Rust JNI core (libmusico_online_lib.so)
        run: cargo build --release -p musico_core --lib
        env:
          MUSICO_VERSION_OVERRIDE: ${{ inputs.version_name || '' }}

      - name: Stage native core into Compose Desktop resources
        run: |
          mkdir -p android/desktopApp/resources/linux
          cp target/release/libmusico_online_lib.so android/desktopApp/resources/linux/

      - name: Set up Java 17 (Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Android SDK environment
        run: echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Derive package version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          VER="${VER%%-*}"
          if [[ ! "$VER" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
            VER="1.0.2"
          fi
          echo "MUSICO_PKG_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Build Linux Compose Desktop packages
        run: gradle :desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:createDistributable "-PmusicoVersionName=${MUSICO_PKG_VERSION}" --console=plain
        working-directory: android

      - name: Collect Linux packages
        run: |
          mkdir -p dist
          DEB=$(find android/desktopApp/build/compose/binaries/main/deb -maxdepth 1 -name '*.deb' | head -1)
          RPM=$(find android/desktopApp/build/compose/binaries/main/rpm -maxdepth 1 -name '*.rpm' | head -1)
          [ -n "$DEB" ] || { echo "No .deb produced" >&2; exit 1; }
          [ -n "$RPM" ] || { echo "No .rpm produced" >&2; exit 1; }
          cp "$DEB" dist/music0-linux-x86_64.deb
          cp "$RPM" dist/music0-linux-x86_64.rpm
          APP_DIR=$(ls -1 android/desktopApp/build/compose/binaries/main/app | head -1)
          [ -n "$APP_DIR" ] || { echo "No Linux app image produced" >&2; exit 1; }
          tar czf dist/music0-linux-x86_64.tar.gz -C android/desktopApp/build/compose/binaries/main/app "$APP_DIR"
          bash scripts/package_appimage.sh --output dist/music0-linux-x86_64.AppImage

      - name: Allow unprivileged user namespaces for Flatpak build
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build Linux Flatpak bundle
        run: bash scripts/package_flatpak.sh --output dist/music0-linux-x86_64.flatpak

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-desktop
          path: dist/*
          if-no-files-found: error

  macos-desktop:
    name: macOS arm64 (Compose Multiplatform dmg / app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Rust core tests
        run: cargo test --workspace --exclude musico_playback

      - name: Build Rust JNI core (libmusico_online_lib.dylib)
        run: cargo build --release -p musico_core --lib
        env:
          MUSICO_VERSION_OVERRIDE: ${{ inputs.version_name || '' }}

      - name: Stage native core into Compose Desktop resources
        run: |
          mkdir -p android/desktopApp/resources/macos
          cp target/release/libmusico_online_lib.dylib android/desktopApp/resources/macos/

      - name: Set up Java 17 (Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Ensure ANDROID_HOME is set
        run: |
          if [ -z "${ANDROID_HOME:-}" ] && [ -d "$HOME/Library/Android/sdk" ]; then
            echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> "$GITHUB_ENV"
          fi

      - name: Derive package version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          VER="${VER%%-*}"
          if [[ ! "$VER" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
            VER="1.0.2"
          fi
          echo "MUSICO_PKG_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Build macOS Compose Desktop packages
        run: gradle :desktopApp:packageDmg :desktopApp:createDistributable "-PmusicoVersionName=${MUSICO_PKG_VERSION}" --console=plain
        working-directory: android

      - name: Collect macOS packages
        run: |
          mkdir -p dist
          DMG=$(find android/desktopApp/build/compose/binaries/main/dmg -maxdepth 1 -name '*.dmg' | head -1)
          [ -n "$DMG" ] || { echo "No .dmg produced" >&2; exit 1; }
          cp "$DMG" dist/Music0-macos-arm64.dmg
          APP_BUNDLE=$(find android/desktopApp/build/compose/binaries/main/app -maxdepth 1 -name '*.app' -exec basename {} \; | head -1)
          [ -n "$APP_BUNDLE" ] || { echo "No macOS .app bundle produced" >&2; exit 1; }
          tar czf dist/Music0-macos-arm64.app.tar.gz \
            -C android/desktopApp/build/compose/binaries/main/app "$APP_BUNDLE"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-desktop
          path: dist/*
          if-no-files-found: error

  windows-desktop:
    name: Windows x86_64 (Compose Multiplatform msi / portable zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Rust core tests
        run: cargo test --workspace --exclude musico_playback

      - name: Build Rust JNI core (musico_online_lib.dll)
        run: cargo build --release -p musico_core --lib
        env:
          MUSICO_VERSION_OVERRIDE: ${{ inputs.version_name || '' }}

      - name: Stage native core into Compose Desktop resources
        shell: bash
        run: |
          mkdir -p android/desktopApp/resources/windows
          cp target/release/musico_online_lib.dll android/desktopApp/resources/windows/

      - name: Ensure WiX Toolset is on PATH (for MSI packaging)
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Get-ChildItem -Path "C:\Program Files (x86)\WiX Toolset*\bin" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($wix) {
              $wix.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              choco install wixtoolset --no-progress -y
              $wix = Get-ChildItem -Path "C:\Program Files (x86)\WiX Toolset*\bin" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($wix) {
                $wix.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              }
            }
          }

      - name: Set up Java 17 (Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Ensure ANDROID_HOME is set
        shell: pwsh
        run: |
          if (-not $env:ANDROID_HOME -and (Test-Path "C:\Android\android-sdk")) {
            "ANDROID_HOME=C:\Android\android-sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Derive package version
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          VER="${VER%%-*}"
          if [[ ! "$VER" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
            VER="1.0.2"
          fi
          echo "MUSICO_PKG_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Build Windows Compose Desktop packages
        shell: bash
        run: gradle :desktopApp:packageMsi :desktopApp:createDistributable "-PmusicoVersionName=${MUSICO_PKG_VERSION}" --console=plain
        working-directory: android

      - name: Collect Windows packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $msi = Get-ChildItem -Path "android\desktopApp\build\compose\binaries\main\msi\*.msi" | Select-Object -First 1
          if (-not $msi) { throw "No .msi produced" }
          Copy-Item $msi.FullName -Destination "dist\Music0-windows-x86_64.msi"
          $appDir = Get-ChildItem -Directory "android\desktopApp\build\compose\binaries\main\app" | Select-Object -First 1
          if (-not $appDir) { throw "No Windows app image produced" }
          Compress-Archive -Path "$($appDir.FullName)\*" -DestinationPath "dist\Music0-windows-x86_64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-desktop
          path: dist/*
          if-no-files-found: error

  android-native:
    name: Android aarch64 (Compose Multiplatform APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Java 17 (Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -1)
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build Rust JNI core (libmusico_online_lib.so)
        run: cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release --lib
        working-directory: musico_core
        env:
          MUSICO_VERSION_OVERRIDE: ${{ inputs.version_name || '' }}
          RUSTFLAGS: "-C link-arg=-lc++_shared"

      - name: Ensure libc++_shared.so is packed and verify symbols
        run: |
          TARGET_LIB="android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so"
          if [ ! -f "$TARGET_LIB" ] || [ "$(stat -c%s "$TARGET_LIB")" -le 100000 ]; then
            LIBCXX=""
            # Always prefer the exact NDK used by cargo-ndk first so ABI symbols
            # (__gxx_personality_v0, etc.) match libmusico_online_lib.so.
            for NDK_DIR in "$ANDROID_NDK_HOME" $(ls -d "$ANDROID_HOME"/ndk/* | sort -Vr); do
              [ -d "$NDK_DIR" ] || continue
              LIBCXX=$(find "$NDK_DIR" \( -path '*arm64-v8a*' -o -path '*aarch64*' \) \
                -name 'libc++_shared.so' -size +100k 2>/dev/null | sort | head -1)
              [ -n "$LIBCXX" ] && break
            done
            if [ -z "$LIBCXX" ]; then
              echo "No real arm64 libc++_shared.so in any installed NDK" >&2
              exit 1
            fi
            echo "Packing $LIBCXX"
            mkdir -p android/app/src/main/jniLibs/arm64-v8a
            cp "$LIBCXX" "$TARGET_LIB"
          else
            echo "cargo-ndk already packed a real libc++_shared.so"
          fi
          ls -lh android/app/src/main/jniLibs/arm64-v8a/
          READELF=""
          if [ -n "${ANDROID_NDK_HOME:-}" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            READELF=$(find "$ANDROID_NDK_HOME" -name 'llvm-readelf' \( -type f -o -type l \) 2>/dev/null | head -1)
          fi
          [ -n "$READELF" ] && [ -x "$READELF" ] \
            || { echo "llvm-readelf not found under ANDROID_NDK_HOME (${ANDROID_NDK_HOME:-<unset>})" >&2; exit 1; }
          NEEDED=$("$READELF" -d android/app/src/main/jniLibs/arm64-v8a/libmusico_online_lib.so | grep NEEDED || true)
          echo "$NEEDED"
          echo "$NEEDED" | grep -q "libc++_shared\.so" \
            || { echo "libmusico_online_lib.so missing NEEDED libc++_shared.so" >&2; exit 1; }
          "$READELF" --dyn-syms "$TARGET_LIB" | grep -q "__gxx_personality_v0" \
            || { echo "libc++_shared.so missing __gxx_personality_v0" >&2; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Decode keystore
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/musico.keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: Derive Android version from the release tag
        run: |
          if [ -n "${{ inputs.version_code }}" ]; then
            echo "MUSICO_VERSION_NAME=${{ inputs.version_name }}" >> "$GITHUB_ENV"
            echo "MUSICO_VERSION_CODE=${{ inputs.version_code }}" >> "$GITHUB_ENV"
            exit 0
          fi
          VER="${GITHUB_REF_NAME#v}"
          VER="${VER%%-*}"
          if [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            MAJOR=$(cut -d. -f1 <<< "$VER")
            MINOR=$(cut -d. -f2 <<< "$VER")
            PATCH=$(cut -d. -f3 <<< "$VER")
            echo "MUSICO_VERSION_NAME=${VER}-cmp" >> "$GITHUB_ENV"
            echo "MUSICO_VERSION_CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH * 100))" >> "$GITHUB_ENV"
          else
            echo "MUSICO_VERSION_NAME=${MUSICO_VERSION_NAME:-1.0.2-cmp}" >> "$GITHUB_ENV"
            echo "MUSICO_VERSION_CODE=${MUSICO_VERSION_CODE:-1000200}" >> "$GITHUB_ENV"
          fi

      - name: Assemble release APK
        run: gradle :app:assembleRelease "-PmusicoVersionCode=${MUSICO_VERSION_CODE:-1000200}" "-PmusicoVersionName=${MUSICO_VERSION_NAME:-1.0.2-cmp}" --console=plain
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: /tmp/musico.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Collect and verify APK
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk -type f -name '*-release*.apk' | head -1)
          [ -n "$APK" ] || { echo "no APK produced" >&2; exit 1; }
          cp "$APK" dist/musico-online-native-aarch64.apk
          unzip -l dist/musico-online-native-aarch64.apk | grep -q "lib/arm64-v8a/libmusico_online_lib.so" \
            || { echo "APK missing libmusico_online_lib.so" >&2; exit 1; }
          unzip -l dist/musico-online-native-aarch64.apk | grep -q "lib/arm64-v8a/libc++_shared.so" \
            || { echo "APK missing libc++_shared.so" >&2; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify dist/musico-online-native-aarch64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android-native
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [linux-desktop, macos-desktop, windows-desktop, android-native]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Music0 ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            **Music0 (Compose Multiplatform)** — One Material 3 Expressive player across **Android**, **Linux**, **macOS**, and **Windows**, backed by a pure-Rust JNI core (`musico_core`, zero Tauri/WebView).

            - **Android** — signed `musico-online-native-aarch64.apk` (64-bit ARM; Media3 ExoPlayer + AudioFX EQ + pure-Rust InnerTube/JioSaavn/Piped streaming).
            - **Linux x86_64** — `music0-linux-x86_64.deb`, `music0-linux-x86_64.rpm`, `music0-linux-x86_64.AppImage`, `music0-linux-x86_64.flatpak`, or portable `music0-linux-x86_64.tar.gz` (bundled JVM + native `musico_playback` DSP audio engine; Flatpak also bundles `yt-dlp`).
            - **macOS Apple Silicon** — `Music0-macos-arm64.dmg` or `Music0-macos-arm64.app.tar.gz`. Unsigned: on first launch, right-click → **Open** (or `xattr -cr /Applications/Music0.app`).
            - **Windows x86_64** — `Music0-windows-x86_64.msi` installer or portable `Music0-windows-x86_64.zip`. Unsigned: click **More info → Run anyway** on SmartScreen.
