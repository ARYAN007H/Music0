name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust-core:
    name: Rust core tests & cdylib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install audio system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Workspace tests
        run: cargo test --workspace --exclude musico_playback
        # Engine e2e needs a real audio device; live network tests are
        # #[ignore]-gated behind MUSICO_LIVE_TESTS.

      - name: Verify Compose Multiplatform JNI cdylib builds
        run: |
          cargo build --release -p musico_core --lib
          nm -D --defined-only target/release/libmusico_online_lib.so | grep -q 'Java_io_github_aryan007h_musicoonline_core_MusicoCore_initNative'
          nm -D --defined-only target/release/libmusico_online_lib.so | grep -q 'Java_io_github_aryan007h_musicoonline_core_MusicoCore_invoke'

      - name: Android SDK environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -1)
          [ -n "$NDK" ] || { echo "No Android NDK found under /usr/local/lib/android/sdk/ndk" >&2; exit 1; }
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build and verify Android arm64 JNI cdylib
        run: |
          rm -rf "$RUNNER_TEMP/jniLibs"
          (cd musico_core && cargo ndk -t arm64-v8a -o "$RUNNER_TEMP/jniLibs" build --release --lib)
          bash scripts/verify_android_so.sh \
            --so "$RUNNER_TEMP/jniLibs/arm64-v8a/libmusico_online_lib.so" \
            --jni-dir "$RUNNER_TEMP/jniLibs/arm64-v8a" \
            --check-musico-jni

  compose-multiplatform:
    name: Compose Multiplatform (Android + Desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 (Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Android SDK environment
        run: echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Compile Android & Desktop Compose Multiplatform + unit tests
        run: gradle :app:compileDebugKotlin :desktopApp:compileKotlin :shared:desktopTest --console=plain
        working-directory: android

  web-engine:
    name: Web preview engine tests & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: TypeScript tests & typecheck
        run: |
          npm test
          npm run build
