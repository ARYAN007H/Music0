name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-core:
    name: Rust core tests & cdylib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install audio system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Workspace tests
        run: cargo test --workspace --exclude musico_playback
        # Engine e2e needs a real audio device; live network tests are
        # #[ignore]-gated behind MUSICO_LIVE_TESTS.

      - name: Verify Compose Multiplatform JNI cdylib builds
        run: cargo build --release -p musico_core --lib

  compose-multiplatform:
    name: Compose Multiplatform (Android + Desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 (Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Android SDK environment
        run: echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Compile Android & Desktop Compose Multiplatform + unit tests
        run: gradle :app:compileDebugKotlin :desktopApp:compileKotlin :shared:desktopTest --console=plain
        working-directory: android

  web-engine:
    name: Web preview engine tests & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: TypeScript tests & typecheck
        run: |
          npm test
          npm run build
