[package]
name = "musico_core"
version = "1.0.1"
edition = "2021"
rust-version = "1.78"
description = "Musico Core — pure-Rust JNI engine for Compose Multiplatform (Android + Desktop)"
license = "MIT"

[lib]
name = "musico_online_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
musico_playback = { path = "../musico_playback" }
musico_recommender = { path = "../musico_recommender" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
# JioSaavn media URLs are "encrypted" with DES-ECB under a fixed public key
# (shipped in every community client) — decoding metadata, not DRM circumvention.
des = "0.8"
ecb = { version = "0.1", features = ["alloc"] }
dirs = "5"
symphonia = { version = "0.5", features = ["all"] }
rand = "0.8"
# Online music: InnerTube (YT Music) search + thumbnail fetch.
# http2: connection reuse + header compression on the catalog endpoints.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "http2"] }
# Cross-platform JNI bridge for Compose Multiplatform (Android + Desktop JVM).
jni = "0.21"

# Android logcat logger (stderr/file logs are unreadable on unrooted devices).
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[dev-dependencies]
tempfile = "3"
