app-id: io.github.aryan007h.Music0
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: musico-online

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # The library scanner reads the user's music; downloads stay in the
  # app-private cache, so no write access to the home directory is needed.
  - --filesystem=xdg-music:ro
  # MPRIS media controls (org.mpris.MediaPlayer2.musico-online, see identity.rs).
  # The app's own D-Bus name is granted automatically from the app id.
  - --own-name=org.mpris.MediaPlayer2.musico-online
  - --talk-name=org.freedesktop.Notifications

modules:
  # yt-dlp is the honest last-resort resolver. It must live inside the sandbox
  # because a Flatpak cannot see the host's PATH; shipping it keeps batch
  # downloads and the yt-dlp fallback working. Update module and manifest
  # together when bumping it.
  - name: yt-dlp
    buildsystem: simple
    build-commands:
      # Build the zipapp from the shipped Python sources instead of installing
      # the prebuilt one from the release tarball. The SDK provides make, zip
      # and python3; the runtime provides python3 at run time.
      - make yt-dlp
      - install -Dm755 yt-dlp /app/bin/yt-dlp
      - install -Dm644 yt-dlp.1 /app/share/man/man1/yt-dlp.1
      - install -Dm644 LICENSE /app/share/licenses/yt-dlp/LICENSE
    sources:
      - type: archive
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp.tar.gz
        sha256: 21f942d258d25cc4e60b4982a25c423460f0bebb835f38e6dfd1fcb140087f95

  - name: musico-online
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/musico-online/cargo
    build-commands:
      - cargo build --release --offline --locked -p musico-online
      - install -Dm755 target/release/musico-online /app/bin/musico-online
      - install -Dm644 flatpak/io.github.aryan007h.Music0.desktop
        /app/share/applications/io.github.aryan007h.Music0.desktop
      - install -Dm644 flatpak/io.github.aryan007h.Music0.metainfo.xml
        /app/share/metainfo/io.github.aryan007h.Music0.metainfo.xml
      - install -Dm644 src-tauri/icons/128x128.png
        /app/share/icons/hicolor/128x128/apps/io.github.aryan007h.Music0.png
      - install -Dm644 src-tauri/icons/128x128@2x.png
        /app/share/icons/hicolor/256x256/apps/io.github.aryan007h.Music0.png
      - install -Dm644 frontend/icons/icon-512.png
        /app/share/icons/hicolor/512x512/apps/io.github.aryan007h.Music0.png
    sources:
      - type: git
        url: https://github.com/ARYAN007H/Music0.git
        tag: v0.8.1-online
        commit: 36f6b934e757556e75d11996d8e7b7f27d4c2327
      - cargo-sources.json
